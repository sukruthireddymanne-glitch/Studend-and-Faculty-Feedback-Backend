spring.application.name=campus-issue-portal
server.port=8080

# H2 Database Configuration (Fallback / Standalone Test Profile)
spring.datasource.url=jdbc:h2:mem:campus_issue_portal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=9a785b62e4f13459c0d12e4f6a78b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6
jwt.expiration=86400000

# Logging
logging.level.com.campus.issueportal=INFO
