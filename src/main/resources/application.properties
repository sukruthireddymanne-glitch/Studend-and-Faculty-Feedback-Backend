spring.application.name=feedback-platform
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/feedback_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (256-bit secret key)
jwt.secret=9a785b62e4f13459c0d12e4f6a78b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6
jwt.expiration=86400000

# Logging
logging.level.com.feedback.platform=INFO
logging.level.org.springframework.security=WARN
