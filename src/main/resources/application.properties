spring.application.name=feedback-platform
server.port=8080

# H2 In-Memory Database Configuration (Zero External Dependencies)
spring.datasource.url=jdbc:h2:mem:feedback_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (256-bit secret key)
jwt.secret=9a785b62e4f13459c0d12e4f6a78b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6
jwt.expiration=86400000

# Logging
logging.level.com.feedback.platform=INFO
logging.level.org.springframework.security=WARN
